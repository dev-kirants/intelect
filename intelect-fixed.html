<style>

.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%,#0f1b4d 0,transparent 60%),var(--bg)}

.item .t{flex:1;min-width:160px}.item .t b{display:block;font-size:16px}.item .t small{display:block}.item .btn{width:auto;margin:0;padding:8px 14px;font-size:13.5px}
.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-weight:600}.tag.live{color:var(--ok);border-color:#34d39955;background:#34d39911}
.drop{border:2px dashed #6366f177;border-radius:16px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s;background:#6366f10d;display:block}.drop:hover,.drop.on{background:#6366f126;border-color:var(--c1)}
.modal{position:fixed;inset:0;z-index:50;background:#02040fcc;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;animation:rise .25s ease}.modal .card{max-width:560px;width:100%;max-height:88vh;overflow:auto;margin:0;background:#0b1030f2}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<script>

const SUPABASE_URL="https://nquciepppnejhdnweqwu.supabase.co";

(function(){
 const ed=e=>{const t=e.target&&(e.target.nodeType===1?e.target:e.target.parentElement);return !!(t&&t.closest&&t.closest('input,textarea,select'))};

// ===== 3. CORE HELPERS =====
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const COL=['linear-gradient(135deg,#3b82f6,#1e3a8a)','linear-gradient(135deg,#14b8a6,#115e59)','linear-gradient(135deg,#f59e0b,#92400e)','linear-gradient(135deg,#a855f7,#581c87)'],SH=['▲','◆','●','■'],TIMES=[10,20,30,60];
let me=null,unsub=[],tick=0,scan=null,draft=null,quizId=null,pending=null,first=true,P={},tab='quizzes',DQ=[],DG=[],IMP=null,IMPX=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clear=()=>{unsub.forEach(f=>f());unsub=[];clearInterval(tick);if(scan){scan.stop().catch(()=>{});scan=null}closeModal()};

const rd=async p=>{try{const r=await p;return r.error?undefined:r.data}catch(e){return undefined}};   // read helper: undefined on error
const safeUrl=u=>{u=String(u||'').trim();if(!u)return'';if(/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u))return u;try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch(e){return''}};
const MARK=`<svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7L4 23V9z" fill="url(#lg)"/><path d="M17.5 7.5l-6.5 10h5l-1.5 7 7-10.5h-5z" fill="#fff"/></svg>`;

  else if(v)h+=`<video class=m src="${esc(v)}" controls playsinline controlslist="nodownload"></video>`}
 return h}
async function signOut(){try{await sb.auth.signOut()}catch(e){}me=null;home()}

// realtime + polling fallback; callback fires only when data actually changed
function live(table,pin,fetcher,cb){let last,dead=false;
 const run=async()=>{if(dead)return;const d=await fetcher();if(d===undefined||dead)return;const s=JSON.stringify(d);if(s!==last){last=s;cb(d)}};
 run();const ch=sb.channel(`${table}-${pin}-${Math.random().toString(36).slice(2)}`).on('postgres_changes',{event:'*',schema:'public',table,filter:`pin=eq.${pin}`},run).subscribe();
 const iv=setInterval(run,3000);return()=>{dead=true;clearInterval(iv);sb.removeChannel(ch)}}

const stamp=()=>new Date().toISOString().slice(0,10);
const xs=v=>typeof v==='string'&&/^([=+@]|-(?![\d.]))/.test(v)?"'"+v:v;      // blocks Excel formula injection
const unx=v=>String(v??'').replace(/^'(?=[=+\-@])/,'');
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)};
function sheet(rows){rows=rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,xs(v)])));const ws=XLSX.utils.json_to_sheet(rows);
 if(rows.length)ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(50,Math.max(k.length+2,...rows.slice(0,50).map(r=>String(r[k]??'').length+2)))}));return ws}
function quizRows(docs){const rows=[];docs.forEach(q=>q.questions.forEach((x,i)=>rows.push({Quiz:q.title,No:i+1,Type:x.type==='mcq'?'Multiple choice':'One word',Question:x.t,'Option A':x.opts?.[0]||'','Option B':x.opts?.[1]||'','Option C':x.opts?.[2]||'','Option D':x.opts?.[3]||'',Correct:x.type==='mcq'?'ABCD'[x.c]:x.a,'Time (s)':x.time,'Image URL':x.img&&!x.img.startsWith('data:')?x.img:(x.img?'[uploaded picture – use JSON backup]':''),'Video URL':x.vid||''})));return rows}
function exportQuizzes(id,f){const docs=id?DQ.filter(d=>d.id===id):DQ;if(!docs.length)return toast('Nothing to export');
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(quizRows(docs)),'Quizzes');
 XLSX.writeFile(wb,`intelect-quizzes-${stamp()}.${f==='csv'?'csv':'xlsx'}`,f==='csv'?{bookType:'csv'}:undefined);toast('Downloaded')}
async function gameData(pin,title){const[ps,as]=await Promise.all([rd(sb.from('players').select('*').eq('pin',pin)),rd(sb.from('answers').select('*').eq('pin',pin))]);
 if(!ps||!as)throw Error('Could not load session data');
 const Pl=[...ps].sort((a,b)=>b.score-a.score),nm={};Pl.forEach(p=>nm[p.uid]=p.name);
 return{results:Pl.map((p,i)=>({PIN:pin,Quiz:title,Rank:i+1,Player:p.name,Score:p.score,Joined:fmt(p.joined)})),
  answers:[...as].sort((a,b)=>a.q-b.q).map(a=>({PIN:pin,Quiz:title,'Question No':a.q+1,Player:nm[a.uid]||'',Answer:typeof a.a==='number'?'ABCD'[a.a]:String(a.a),Time:fmt(a.t)}))}}
async function exportGame(pin){toast('Preparing…');try{const g=DG.find(d=>d.id===pin),r=await gameData(pin,g.title);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(r.results),'Results');XLSX.utils.book_append_sheet(wb,sheet(r.answers),'Answers');XLSX.writeFile(wb,`intelect-session-${pin}.xlsx`);toast('Excel downloaded')}catch(e){toast(e.message)}}
async function exportAll(){toast('Preparing workbook…');try{const wb=XLSX.utils.book_new(),res=[],ans=[];
 for(const g of DG){const r=await gameData(g.id,g.title);res.push(...r.results);ans.push(...r.answers)}
 XLSX.utils.book_append_sheet(wb,sheet(quizRows(DQ)),'Quizzes');
 XLSX.utils.book_append_sheet(wb,sheet(DG.map(d=>({PIN:d.id,Quiz:d.title,Questions:d.n,Status:d.state==='end'?'Completed':'Open',Created:fmt(d.created),Players:res.filter(r=>r.PIN===d.id).length}))),'Sessions');
 XLSX.utils.book_append_sheet(wb,sheet(res),'Results');XLSX.utils.book_append_sheet(wb,sheet(ans),'Answers');
 XLSX.writeFile(wb,`intelect-all-data-${stamp()}.xlsx`);markBackup();toast('Full export downloaded')}catch(e){toast('Export failed: '+e.message)}}
async function backupJSON(){toast('Preparing backup…');try{const sessions=[];
 for(const g of DG){const r=await gameData(g.id,g.title);sessions.push({pin:g.id,title:g.title,state:g.state,questions:g.n,created:g.created,results:r.results,answers:r.answers})}
 const out={app:'intelect',version:2,exported:new Date().toISOString(),account:me.email||'',quizzes:DQ.map(q=>({title:q.title,created:q.created,questions:q.questions})),sessions};
 dl(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}),`intelect-backup-${stamp()}.json`);markBackup();toast('Backup downloaded');if(tab==='data')dash('data')}catch(e){toast('Backup failed: '+e.message)}}

// ===== EXCEL / BACKUP: import =====
const hk=k=>String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
const snap=t=>TIMES.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a,20);
function cleanQ(q){if(!q||typeof q!=='object')return null;const type=q.type==='word'?'word':'mcq',t=cut(q.t,300);if(!t)return null;
 const o={t,type,opts:['','','',''],c:0,a:'',img:safeUrl(q.img),vid:safeUrl(q.vid),time:snap(+q.time||20)};
 if(type==='mcq'){o.opts=[0,1,2,3].map(i=>cut(q.opts?.[i],120));const c=+q.c;if(!Number.isInteger(c)||c<0||c>3||o.opts.filter(Boolean).length<2||!o.opts[c])return null;o.c=c}
 else{o.a=cut(q.a,200);if(!o.a)return null}
 return o}
function parseRows(rows){const by=new Map();let skip=0;
 rows.slice(0,5000).forEach(r=>{const o={};for(const k in r)o[hk(k)]=unx(r[k]);
  const title=cut(o.quiz||o.quiztitle||o.title,80),t=cut(o.question,300);if(!title||!t){skip++;return}
  const type=/word|text|short/i.test(o.type||'')?'word':'mcq';
  const opts=['optiona','optionb','optionc','optiond'].map(k=>cut(o[k],120)),cor=cut(o.correct||o.answer,200);
  const c=type==='mcq'?(/^[a-d]$/i.test(cor)?'abcd'.indexOf(cor.toLowerCase()):opts.findIndex(x=>x&&norm(x)===norm(cor))):0;
  const q=cleanQ({t,type,opts,c,a:cor,img:o.imageurl,vid:o.videourl,time:+o.times||+o.time||20});
  if(!q||(by.get(title)||[]).length>=200){skip++;return}
  if(!by.has(title))by.set(title,[]);by.get(title).push(q)});
 return{by,skip}}
function importFile(f){if(!f)return;if(f.size>15e6)return toast('File too large (max 15 MB)');
 const isJ=/\.json$/i.test(f.name),fr=new FileReader();fr.onerror=()=>toast('Could not read file');
 fr.onload=e=>{try{let by=new Map(),skip=0,note='';
  if(isJ){const j=JSON.parse(e.target.result);if(!j||j.app!=='intelect'||!Array.isArray(j.quizzes))throw Error('Not an Intelect backup file');
   j.quizzes.slice(0,200).forEach(z=>{const title=cut(z?.title,80),qs=(Array.isArray(z?.questions)?z.questions:[]).slice(0,200).map(cleanQ),ok=qs.filter(Boolean);skip+=qs.length-ok.length;
    if(!title||!ok.length){skip++;return}let t=title,i=2;while(by.has(t))t=`${title} (${i++})`;by.set(t,ok)});
   if(Array.isArray(j.sessions)&&j.sessions.length)note=`<p class=muted>The backup also contains ${j.sessions.length} past session${j.sessions.length>1?'s':''} (results stay in the file for your records).</p>`}
  else{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames.find(n=>/quiz/i.test(n))||wb.SheetNames[0]],r=parseRows(XLSX.utils.sheet_to_json(ws,{defval:''}));by=r.by;skip=r.skip}
  if(!by.size)return toast('No valid questions found — check the template');IMP=by;
  const qn=[...by.values()].reduce((s,a)=>s+a.length,0);
  openModal(`<h1>Ready to import</h1><p class=muted>${by.size} quiz${by.size>1?'zes':''} · ${qn} questions${skip?` · <span class=no>${skip} item${skip>1?'s':''} skipped</span>`:''}</p>${note}
  ${[...by].slice(0,30).map(([k,a])=>`<div class=item><div class=t><b>${esc(k)}</b><small>${a.length} questions</small></div></div>`).join('')}
  <div class=row><button class="btn pri sm" onclick="doImport()">Import now</button><button class="btn sm" onclick="closeModal()">Cancel</button></div>`)}catch(x){toast('Could not read file: '+x.message)}};
 isJ?fr.readAsText(f):fr.readAsArrayBuffer(f)}
async function doImport(){if(!IMP)return;let n=0,dup=0;const have=new Set(DQ.map(d=>d.title+'|'+JSON.stringify(d.questions)));
 for(const[title,questions]of IMP){if(have.has(title+'|'+JSON.stringify(questions))){dup++;continue}
  if(JSON.stringify(questions).length>900000){toast(`"${title}" too large, skipped`);continue}
  const {error}=await sb.from('quizzes').insert({title,questions,n:questions.length});if(error){toast(error.message);continue}n++}
 IMP=null;closeModal();toast(`Imported ${n} quiz${n===1?'':'zes'}${dup?` · ${dup} duplicate${dup>1?'s':''} skipped`:''}`);tab='quizzes';dash('quizzes')}
function template(){const wb=XLSX.utils.book_new(),ex=[
 {Quiz:'Sample quiz',No:1,Type:'Multiple choice',Question:'Which planet is known as the Red Planet?','Option A':'Venus','Option B':'Mars','Option C':'Jupiter','Option D':'Mercury',Correct:'B','Time (s)':20,'Image URL':'','Video URL':''},
 {Quiz:'Sample quiz',No:2,Type:'One word',Question:'Capital of France?','Option A':'','Option B':'','Option C':'','Option D':'',Correct:'Paris|paris','Time (s)':20,'Image URL':'','Video URL':''}];
 XLSX.utils.book_append_sheet(wb,sheet(ex),'Quizzes');
 XLSX.utils.book_append_sheet(wb,sheet([{Column:'Type',Rule:'"Multiple choice" or "One word"'},{Column:'Correct',Rule:'MCQ: letter A–D. One word: answer; alternates split by |'},{Column:'Time (s)',Rule:'10, 20, 30 or 60'},{Column:'Quiz',Rule:'Rows with the same Quiz title become one quiz'},{Column:'Image/Video URL',Rule:'https links only'}]),'Instructions');
 XLSX.writeFile(wb,'intelect-import-template.xlsx')}

// ===== QUIZ BUILDER =====
const blank=()=>({t:'',type:'mcq',opts:['','','',''],c:0,a:'',img:'',vid:'',time:20});
async function edit(id){quizId=id||null;if(id){const d=await rd(sb.from('quizzes').select('*').eq('id',id).single());if(!d)return toast('Could not load quiz');draft={title:d.title,questions:d.questions}}else draft={title:'',questions:[blank()]};builder()}
function builder(){clear();const d=draft;
 show(`${logo()}<main><div class=hd><div><span class=eyebrow>Quiz builder</span><h2 class=big-h style="margin-top:12px">${quizId?'Edit':'New'} quiz</h2></div></div><div class="card glow"><input id=ti maxlength=80 placeholder="Quiz title" value="${esc(d.title)}" style="font-size:18px;font-weight:600"></div>
 ${d.questions.map((q,i)=>`<div class="card qc"><div class=row><b class=grad style="font-family:'Space Grotesk';font-size:18px">Q${i+1}</b>
 <select style="flex:1;min-width:140px" data-i=${i} data-k=type><option value=mcq ${q.type==='mcq'?'selected':''}>Multiple choice</option><option value=word ${q.type==='word'?'selected':''}>One word</option></select>
 <select style="width:90px" data-i=${i} data-k=time>${TIMES.map(t=>`<option value=${t} ${q.time==t?'selected':''}>${t}s</option>`).join('')}</select>
 ${d.questions.length>1?`<button class="btn red" onclick="rmQ(${i})">Delete</button>`:''}</div>
 <input data-i=${i} data-k=t maxlength=300 placeholder="Type your question" value="${esc(q.t)}">
 <div class=row><label class=btn style="flex:1;text-align:center;cursor:pointer">Add picture<input type=file accept="image/*" data-img=${i} data-i=${i} hidden></label>${q.img?`<button class="btn red" onclick="draft.questions[${i}].img='';builder()">Remove</button>`:''}</div>
 <input data-i=${i} data-k=vid maxlength=300 placeholder="Video link (YouTube or https .mp4)" value="${esc(q.vid)}">${media(q)}
 ${q.type==='mcq'?q.opts.map((o,j)=>`<div class=row style="flex-wrap:nowrap"><input type=radio name=c${i} data-i=${i} data-c=${j} ${q.c==j?'checked':''}><span style="width:20px;text-align:center">${SH[j]}</span><input data-i=${i} data-o=${j} maxlength=120 placeholder="Option ${j+1}" value="${esc(o)}"></div>`).join('')+'<div class=rl>Select the circle next to the correct answer</div>'
 :`<input data-i=${i} data-k=a maxlength=200 placeholder="Correct answer (alternates: cat|kitten)" value="${esc(q.a)}">`}</div>`).join('')}
 ${d.questions.length<200?'<button class=btn onclick="draft.questions.push(blank());builder()">+ Add question</button>':''}
 <button class="btn big" onclick="saveQ()">Save quiz</button><p class=lnk onclick="dash('quizzes')">Back to control center</p></main>`)}
app.oninput=app.onchange=async e=>{const t=e.target;if(t.id==='ti'&&draft)return draft.title=t.value;const i=t.dataset.i;if(i==null||!draft)return;const q=draft.questions[i];
 if(t.dataset.img!=null){const f=t.files[0];if(f&&/^image\//.test(f.type)){q.img=await comp(f);builder()}}
 else if(t.dataset.o!=null)q.opts[t.dataset.o]=t.value;else if(t.dataset.c!=null)q.c=+t.dataset.c;
 else if(t.dataset.k){q[t.dataset.k]=t.dataset.k==='time'?+t.value:t.value;if(t.dataset.k==='type')builder()}};
const comp=f=>new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>{URL.revokeObjectURL(u);r('')};i.src=u});
function rmQ(i){draft.questions.splice(i,1);builder()}
async function saveQ(){const d=draft;d.title=cut(d.title,80);if(!d.title)return toast('Add a quiz title');
 for(const[i,q]of d.questions.entries()){if(!q.t.trim())return toast(`Q${i+1}: add the question`);
  if(q.type==='mcq'){if(q.opts.filter(o=>o.trim()).length<2||!q.opts[q.c].trim())return toast(`Q${i+1}: need 2+ options and a correct one`)}else if(!q.a.trim())return toast(`Q${i+1}: add the answer`)}
 const qs=d.questions.map(cleanQ);if(qs.some(x=>!x))return toast('Some questions are invalid (links must be https)');
 if(JSON.stringify(qs).length>900000)return toast('Too much media for one quiz — use links for big images');
 const data={title:d.title,questions:qs,n:qs.length};
 const {error}=quizId?await sb.from('quizzes').update(data).eq('id',quizId):await sb.from('quizzes').insert(data);
 if(error)return toast(error.message);toast('Saved');dash('quizzes')}

// ===== HOST =====
async function hostGame(id){const qd=await rd(sb.from('quizzes').select('*').eq('id',id).single());if(!qd)return toast('Could not load quiz');const Q=qd.questions;let pin=null;
 for(let t=0;t<12&&!pin;t++){const p=String(100000+Math.floor(Math.random()*900000));
  const {error}=await sb.from('games').insert({pin:p,host:me.id,title:qd.title,qid:id,state:'lobby',q:-1,n:Q.length});
  if(!error)pin=p;else if(error.code!=='23505')return toast(error.message)}
 if(!pin)return toast('Could not allocate a game code, try again');
 const fail=async m=>{await sb.from('games').delete().eq('pin',pin);toast(m)};
 let r=await sb.from('game_private').insert({pin,k:Q.map(q=>q.type==='mcq'?q.c:q.a.split('|').map(norm))});if(r.error)return fail(r.error.message);
 r=await sb.from('game_qs').insert(Q.map((q,i)=>{const{c,a,...pub}=q;return{pin,idx:i,data:pub}}));if(r.error)return fail(r.error.message);
 hostView(pin,Q)}
function hostView(pin,Q){clear();let g={},ps=[],ans=[],key,busy=false,aq=-2,au=()=>{};
 unsub.push(()=>au());rd(sb.from('game_private').select('k').eq('pin',pin).single()).then(d=>key=d&&d.k);
 const upd=()=>{const c=$('#cn');if(c)c.textContent=`${ans.length}/${ps.length} answered`};
 const refresh=async()=>{const d=await getGame(pin)();if(d!==undefined){g=mapG(d);r()}};
 unsub.push(live('players',pin,getPlayers(pin),d=>{ps=d;if(g.state==='lobby')r();else upd()}));
 unsub.push(live('games',pin,getGame(pin),d=>{g=mapG(d);r()}));
 const reveal=async()=>{if(busy||g.state!=='question'||!g.qStart||!key)return;busy=true;clearInterval(tick);
  const q=Q[g.q],k=key[g.q],st=g.qStart,lim=q.time*1000,by={};
  const A=await rd(sb.from('answers').select('uid,a,t').eq('pin',pin).eq('q',g.q));
  if(!A){busy=false;toast('Network issue — retrying');setTimeout(reveal,1500);return}
  A.forEach(a=>by[a.uid]=a);
  const rows=ps.map(p=>{const a=by[p.id];let ok=false,pts=0;
   if(a&&a.t){const el=Date.parse(a.t)-st;if(el<=lim+1500){ok=q.type==='mcq'?a.a===k:k.includes(norm(a.a));if(ok)pts=Math.round(1000*(1-Math.min(Math.max(el,0)/lim,1)/2))}}
   const sk=ok?(p.streak||0)+1:0;if(ok)pts+=Math.min(sk-1,4)*50;
   return{uid:p.id,score:(p.score||0)+pts,streak:sk,last:{q:g.q,ok,pts}}});
  const {error}=await sb.rpc('finish_question',{p_pin:pin,p_rows:rows,p_reveal:q.type==='mcq'?q.opts[q.c]:q.a.split('|')[0].trim()});
  busy=false;if(error)toast(error.message);else refresh()};
 window.nextQ=async()=>{const n=g.q+1;const {error}=await sb.from('games').update(n>=g.n?{state:'end'}:{state:'question',q:n,reveal:null}).eq('pin',pin);if(error)return toast(error.message);refresh()};
 window.skipQ=reveal;
 const r=()=>{
  if(g.state==='lobby'){if(!$('#pl')){show(`${logo()}<main><div class="card glow"><h1 class=c>${esc(g.title)}</h1><p class="c muted">Join at this page with code</p><div class=pin>${pin}</div><div id=qr></div>
   <div class=c><b id=ct></b></div><div class=pl id=pl style="text-align:center;margin:10px 0"></div><button class="btn big" onclick="nextQ()">Start quiz</button></div></main>`);
   new QRCode($('#qr'),{text:location.origin+location.pathname+'?pin='+pin,width:200,height:200})}
   $('#ct').textContent=ps.length+' player'+(ps.length===1?'':'s')+' joined';$('#pl').innerHTML=ps.map(p=>`<span>${esc(p.name)}</span>`).join('')}
  else if(g.state==='question'){if(aq!==g.q){aq=g.q;au();ans=[];au=live('answers',pin,async()=>{const d=await rd(sb.from('answers').select('uid').eq('pin',pin).eq('q',g.q));return d},d=>{ans=d;upd()});const q=Q[g.q];
    show(`${logo()}<main><div class="card glow"><div class=row><b>Question ${g.q+1}/${g.n}</b><span style="flex:1"></span><span id=cn class=muted></span></div><div class=bar><div id=tm></div></div>
    <h1 class=c style="font-size:28px">${esc(q.t)}</h1>${media(q)}${q.type==='mcq'?`<div class=opts>${q.opts.map((o,j)=>o.trim()?`<div class=opt style="background:${COL[j]}">${SH[j]} ${esc(o)}</div>`:'').join('')}</div>`:'<p class="c muted"><i>Players type a one-word answer</i></p>'}
    <button class=btn onclick="skipQ()" style="margin-top:16px">End question and show results</button></div></main>`);upd();
    clearInterval(tick);tick=setInterval(()=>{if(!g.qStart)return;const rem=Math.max(0,q.time*1000-(Date.now()-g.qStart));const tm=$('#tm');if(tm)tm.style.width=rem/q.time/10+'%';
     if(rem<=0||(ps.length&&ans.length>=ps.length))reveal()},250)}}
  else if(g.state==='lb'){aq=-2;au();clearInterval(tick);show(`${logo()}<main><div class="card glow"><h1 class=c>Correct answer: <span class=ok>${esc(g.reveal)}</span></h1><h2 class=c>Leaderboard</h2>${lb(ps,5)}
   <button class="btn big" onclick="nextQ()">${g.q+1>=g.n?'View final results':'Next question'}</button></div></main>`)}
  else if(g.state==='end'){aq=-2;au();clearInterval(tick);show(`${logo()}<main><div class="card glow"><h1 class=c>🏆 Final results</h1>${podium(ps)}${lb(ps,10)}<div class=row><button class="btn pri" style="flex:1" onclick="dash('sessions')">Done</button></div></div></main>`)}};}

// ===== PLAYER =====
function player(pin,uid){clear();
 const myId=()=>uid;
 P={pin,uid:myId(),done:-1,drawn:null};let g={},ps=[],q=null,qi=-2;
 unsub.push(live('players',pin,getPlayers(pin),d=>{ps=d;r()}));
 unsub.push(live('games',pin,getGame(pin),async d=>{g=mapG(d);if(g.state==='question'&&qi!==g.q){qi=g.q;q=null;r();const x=await rd(sb.from('game_qs').select('data').eq('pin',pin).eq('idx',g.q).single());q=x&&x.data}r()}));
 window.pAns=async a=>{if(a===''||a==null)return;const k=g.q;P.done=k;r();
  const {error}=await sb.from('answers').insert({pin,q:k,uid:myId(),a});if(error&&error.code!=='23505'){P.done=-1;r();toast('Send failed, try again')}};
 window.pAnsW=()=>pAns(($('#wa').value||'').trim().slice(0,100));
 const meP=()=>ps.find(p=>p.id===myId())||{score:0},rank=()=>[...ps].sort((a,b)=>b.score-a.score).findIndex(p=>p.id===myId())+1;
 const r=()=>{const w=h=>show(`${logo()}<main><div class="card glow">${h}</div></main>`);
  if(g.state!=='question')P.drawn=null;
  if(!g.state)return w('<h1 class=c>Game not found</h1><button class=btn onclick="home()">Home</button>');
  if(g.state==='lobby')return w(`<div class=pulse></div><h1 class=c>You're in, ${esc(meP().name)}!</h1><p class="c muted">Waiting for the host to start…</p>`);
  if(g.state==='question'){if(!q)return w('<div class=pulse></div><p class="c muted">Loading question…</p>');
   if(P.done===g.q)return w('<div class=pulse></div><h1 class=c>Answer locked in</h1><p class="c muted">Waiting for results…</p>');
   if(P.drawn===g.q&&$('#tm'))return;
   P.drawn=g.q;
   w(`<div class=bar><div id=tm></div></div><h2 class=c style="font-size:24px">${esc(q.t)}</h2>${media(q)}${q.type==='mcq'?`<div class=opts>${q.opts.map((o,j)=>o.trim()?`<button class=opt style="background:${COL[j]}" onclick="pAns(${j})">${SH[j]} ${esc(o)}</button>`:'').join('')}</div>`
    :'<input id=wa maxlength=100 placeholder="Type your answer" autocomplete=off onkeydown="if(event.key===\'Enter\')pAnsW()"><button class="btn pri" onclick="pAnsW()">Submit</button>'}`);
   clearInterval(tick);tick=setInterval(()=>{const e=$('#tm');if(!e||!g.qStart)return;e.style.width=Math.max(0,q.time*1000-(Date.now()-g.qStart))/q.time/10+'%'},250);return}
  clearInterval(tick);const m=meP(),l=m.last||{};
  if(g.state==='lb')return w(`<h1 class="c verdict">${l.ok?'<span class=ok>Correct  +'+l.pts+'</span>':'<span class=no>Incorrect</span>'}</h1><p class=c>Answer: <b>${esc(g.reveal)}</b></p>
   <h3 class=c>You're #${rank()} · ${m.score} pts</h3>${lb(ps,5,myId())}<p class="c muted">Waiting for next question…</p>`);
  w(`<h1 class=c>You finished #${rank()}</h1><p class="c grad" style="font-size:28px;font-weight:700">${m.score} points</p>${podium(ps)}${lb(ps,5,myId())}<button class="btn pri" onclick="home()">Home</button>`)};}
</script></body></html>
